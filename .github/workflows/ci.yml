name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  extraction:
    name: beaza_extraction (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/beaza_extraction
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test --reporter expanded
      - name: Evaluate on the seed set (FR-6.3)
        run: |
          dart run bin/evaluate.dart --data eval/seed.jsonl --check
          dart run bin/evaluate.dart --data eval/seed.jsonl --system B1,B2,B3 --out eval/results
          cat eval/results/report.md >> "$GITHUB_STEP_SUMMARY"
          dart run bin/evaluate.dart --data eval/real_nbb.jsonl --out eval/results/real_nbb
          cat eval/results/real_nbb/report.md >> "$GITHUB_STEP_SUMMARY"
          dart run bin/evaluate.dart --data eval/real_other.jsonl --out eval/results/real_other
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: packages/beaza_extraction/eval/results/

  assistant:
    name: beaza_assistant (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/beaza_assistant
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test --reporter expanded

  crypto:
    name: beaza_crypto (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/beaza_crypto
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test --reporter expanded

  server:
    name: Sync server (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node version
        run: node --version
      - name: Test
        run: npm test

  # The phone (Dart) and the server (TypeScript) are tested separately above,
  # each with its own assumptions. This job makes a real account with the
  # Dart code, sends it to the real server code, and opens the answers with
  # Dart again, so a mismatch between the two sides fails here.
  contract:
    name: Phone and server agree (real keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 1. Make a real account as the phone does (Dart)
        working-directory: packages/beaza_crypto
        run: |
          dart pub get
          dart run tool/sample_account.dart > "$RUNNER_TEMP/account.json"
      - name: 2. Send it to the server code (Node, SQLite)
        working-directory: server
        run: node scripts/contract.ts "$RUNNER_TEMP/account.json" "$RUNNER_TEMP/responses.json"
      - name: 3. Open the server's answers as a second phone (Dart)
        working-directory: packages/beaza_crypto
        run: dart run tool/check_responses.dart "$RUNNER_TEMP/account.json" "$RUNNER_TEMP/responses.json"

  app:
    name: Flutter app (analyze, test, build APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      # Pictures of drawn widgets to look at (not compared with anything).
      - name: Screenshots
        run: flutter test --update-goldens screenshots
      - name: Screenshots in the log (base64, one line each)
        run: for f in screenshots/*.png; do echo "SHOT $(basename "$f") $(base64 -w0 "$f")"; done
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshots/*.png
          retention-days: 14
      # The real phone code against the real server code, over HTTP: two
      # phones, real encryption and Argon2id. Catches what each side's own
      # tests (with their own pretend counterpart) cannot.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Two phones on the real server code
        run: |
          node ../server/scripts/serve-local.ts 8787 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/v1/health && break
            sleep 1
          done
          flutter test test_live --reporter expanded \
            --dart-define=BEAZA_LIVE_SERVER=http://127.0.0.1:8787
      # Release build signed with the debug key: installable for testing, no
      # INTERNET permission (the template adds it only to debug builds).
      # The permission list below is printed so every run documents it.
      - name: Build APK (arm64)
        run: flutter build apk --release --no-shrink --target-platform android-arm64
      - name: List APK permissions
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beaza-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
