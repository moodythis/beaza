name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  extraction:
    name: beaza_extraction (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/beaza_extraction
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test --reporter expanded

  app:
    name: Flutter app (analyze, test, build APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      # The Android folder is not committed yet. Generate it from the official
      # template when missing; existing files (lib/, test/) are never overwritten.
      - name: Create Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org bh.beaza --project-name beaza .
          fi
      # Keep the encrypted database out of Android's cloud backup: the key
      # lives in the Keystore and does not travel with a restore.
      - name: Disable Android backup
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup' "$M" || sed -i 's#<application#<application android:allowBackup="false" android:fullBackupContent="false" android:dataExtractionRules="@xml/data_extraction_rules_none"#' "$M"
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<data-extraction-rules>\n  <cloud-backup disableIfNoEncryptionCapabilities="false"><exclude domain="root"/></cloud-backup>\n  <device-transfer><exclude domain="root"/></device-transfer>\n</data-extraction-rules>\n' > android/app/src/main/res/xml/data_extraction_rules_none.xml
          grep -n 'allowBackup' "$M"
      # Release build signed with the debug key: installable for testing, no
      # INTERNET permission (the template adds it only to debug builds).
      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
      - name: List APK permissions
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beaza-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
