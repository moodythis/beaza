name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  extraction:
    name: beaza_extraction (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/beaza_extraction
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test --reporter expanded

  app:
    name: Flutter app (analyze, test, build APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      # Release build signed with the debug key: installable for testing, no
      # INTERNET permission (the template adds it only to debug builds).
      # The permission list below is printed so every run documents it.
      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
      - name: List APK permissions
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beaza-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
