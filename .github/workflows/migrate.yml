name: Migrate to EU database (temporary)

# One-time. Starts the copy of all accounts to the EU database on the live
# server and checks the result. Removed afterwards.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Server URL
        default: https://beaza-sync.moodythis.workers.dev

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/call-migrate.ts "${{ inputs.url }}"
