name: Graphify

# Builds the graphify knowledge graph and saves it on this branch.
on:
  push:
    branches: [graphify]
    paths: ['.graphify-ci/**', '.github/workflows/graphify.yml']

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "graphifyy[sql]"
      - run: pip show graphifyy | head -2
      - run: python .graphify-ci/run.py
      - name: Save outputs on this branch
        run: |
          git config user.name "graphify-ci"
          git config user.email "graphify-ci@users.noreply.github.com"
          git add -f graphify-out
          git commit -m "Graphify outputs" || exit 0
          git push
