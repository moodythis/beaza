name: beaza_assistant
description: Beaza's spending assistant. Pure Dart. Amounts, totals and percentages are computed here in integer fils; a language model, if one is allowed at all, only rephrases a reply whose numbers are already fixed.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  beaza_extraction:
    path: ../beaza_extraction

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
