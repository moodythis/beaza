name: beaza_crypto
description: End-to-end encryption for Beaza sync. Keys are made and used only on the phone; the server stores locked keys and encrypted records it cannot read.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # Pure Dart XChaCha20-Poly1305, Argon2id and HKDF, so the same code runs in
  # tests, in the app and on any platform.
  cryptography: ^2.9.0
  # Synchronous SHA-256 for the recovery key checksum.
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
