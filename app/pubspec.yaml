name: beaza
description: Beaza (بيزة), a local-first daily spending guardrail for Bahrain.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  beaza_extraction:
    path: ../packages/beaza_extraction
  beaza_crypto:
    path: ../packages/beaza_crypto
  http: ^1.2.0
  crypto: ^3.0.3
  drift: ">=2.32.0 <3.0.0"
  sqlite3: ">=3.0.0 <4.0.0"
  path: ^1.9.0
  path_provider: ^2.1.0
  flutter_secure_storage: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ">=2.32.0 <3.0.0"

flutter:
  uses-material-design: true
  generate: true

# Encryption: SQLite3 Multiple Ciphers (SQLCipher-compatible), built by the
# sqlite3 package. The key never leaves the phone's Android Keystore.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
